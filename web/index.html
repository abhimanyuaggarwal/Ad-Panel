<body>
<div id="nav-progress"><div class="np-fill"></div></div>
<div class="shell">
  <header class="topbar">
    <div class="tb-in">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <defs><linearGradient id="bm" x1="10" y1="42" x2="40" y2="20" gradientUnits="userSpaceOnUse">

  </header>
  <main id="main"></main>

<div id="toasts"></div>
<div id="dialog-root"></div>
<!-- Plain scripts in dependency order — the panel is deliberately no-build (see
     README). Everything is a global; ORDER MATTERS ONLY FOR TOP-LEVEL READS, which
     these files avoid: every cross-file call happens at runtime, after all load.
     util → api → controls → publish/review → tags → setups (list, editor) →
     keys (list, bulk, form) → behaviours/policies → main (router; runs last). -->
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/controls.js"></script>
<script src="js/publish.js"></script>
<script src="js/review.js"></script>
<script src="js/views-tags.js"></script>
<script src="js/views-setups-list.js"></script>
<script src="js/views-setups.js"></script>
<script src="js/views-keys-list.js"></script>
<script src="js/views-keys-bulk.js"></script>
<script src="js/views-keys-form.js"></script>
<script src="js/views-keys-drive.js"></script>
<script src="js/views-keys-player.js"></script>
<script src="js/views-keys-shell.js"></script>
<script src="js/views-behaviours.js"></script>
<script src="js/views-policies.js"></script>
<script src="js/main.js"></script>
